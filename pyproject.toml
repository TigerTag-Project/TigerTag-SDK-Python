[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigertag"
version = "1.1.1"
description = "Offline Python SDK for TigerTag RFID material identification"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
keywords = [
    "tigertag", "rfid", "nfc", "materials", "manufacturing",
    "ntag213", "identification", "3d-printing", "filament", "resin",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
sync   = ["requests>=2.28"]
verify = ["cryptography>=41.0"]
full   = ["requests>=2.28", "cryptography>=41.0"]

[project.scripts]
tigertag = "tigertag.cli:main"

[project.urls]
Homepage      = "https://tigertag.io"
Repository    = "https://github.com/TigerTag-Project/TigerTag-SDK-Python"
Documentation = "https://github.com/TigerTag-Project/TigerTag-RFID-Guide"
"Bug Tracker" = "https://github.com/TigerTag-Project/TigerTag-SDK-Python/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["tigertag*"]

[tool.setuptools.package-data]
tigertag = ["database/*.json"]
