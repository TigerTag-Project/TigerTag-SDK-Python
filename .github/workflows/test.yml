name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK with all optional dependencies
        run: pip install -e ".[full]"

      - name: Run tests
        run: python -m unittest discover tests/ -v

  site:
    name: Showcase site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The same checks pages.yml runs before a deploy (site/README.md).
      - name: Check the translations and sources
        run: python site/build.py --check

      - name: Build and check the site for search and answer engines
        run: python site/build.py --out _site && python site/seo_check.py _site
